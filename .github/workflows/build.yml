name: Build iPhone unsigned
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Verify native format policy
        run: swiftc Sources/CapturePolicy.swift Sources/ColorMath.swift Tests/CapturePolicyTests.swift -o /tmp/cowboy-capture-policy && /tmp/cowboy-capture-policy
      - name: Verify zoom calibration (simulated camera must pass before the app is built)
        run: swiftc -O Sources/ZoomKernel.swift Sources/SwitchAligner.swift Tests/ZoomCalibTests.swift -o /tmp/zoomcalib && /tmp/zoomcalib
      - name: Verify motion blur math (tela, arquivo e render da VPS)
        run: swiftc -O Sources/MotionBlur.swift Tests/MotionBlurTests.swift -o /tmp/motionblur && /tmp/motionblur
      - name: Verify Metal shader (compiled at runtime on the iPhone)
        run: python3 tools/extract_shader.py /tmp/bake.metal && xcrun -sdk iphoneos metal -c /tmp/bake.metal -o /tmp/bake.air && echo SHADER OK
      - name: Build native camera
        run: xcodebuild -project CowboyRec.xcodeproj -scheme CowboyRec -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CowboyRec.app Payload/
          zip -qr CowboyRec-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CowboyRec-unsigned
          path: CowboyRec-unsigned.ipa
          retention-days: 3

name: CowboyRec
options:
  bundleIdPrefix: com.cowboy
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "O Cowboy usa a câmera nativa do iPhone para gravar com estabilização."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "O Cowboy grava áudio junto do vídeo."
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    DEVELOPMENT_LANGUAGE: pt-BR
    INFOPLIST_KEY_CFBundleDevelopmentRegion: pt-BR
    MARKETING_VERSION: "0.8.6"
    CURRENT_PROJECT_VERSION: "43"
targets:
  CowboyRec:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cowboy.rec.personal
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CowboyRec-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Cowboy Rec"
schemes:
  CowboyRec:
    build:
      targets:
        CowboyRec: all

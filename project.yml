name: CowboyRec
options:
  bundleIdPrefix: com.cowboy
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "O Cowboy usa a câmera nativa do iPhone para gravar com estabilização."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "O Cowboy grava áudio junto do vídeo."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CowboyRec:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cowboy.rec.personal
schemes:
  CowboyRec:
    build:
      targets:
        CowboyRec: all
